# ─────────────────────────────────────────────────────────────────────────────
# Govori (.NET 9) — self-contained dev/prod-parity stack.
#
#   cp .env.example .env
#   docker compose -f docker-compose.dotnet.yml up -d --build
#
# Brings up (each HEALTHY, dependency-ordered):
#   db   — Postgres 16, AUTO-SEEDED from the demo dump on first run (database-first:
#          EF never creates the schema).
#   redis — OTP store + SignalR backplane + rate-limit backend.
#   minio (+ minio-init) — S3-compatible object storage + the govori-audio bucket.
#   api   — ASP.NET Core (REST /api/*, SignalR /hubs/attempts, /health, /metrics).
#   worker — Hangfire server + recurring maintenance jobs (ex-Celery).
#   frontend — nginx serving the Vite SPA + reverse-proxying /api and /hubs to `api`.
#
# INDEPENDENT of the legacy Python docker-compose.yml / .prod.yml (own project name,
# network and volumes). Ports are parameterised in .env to avoid host clashes.
# ─────────────────────────────────────────────────────────────────────────────

name: govori-dotnet

# Shared backend env (Api + Worker). Values resolve from .env with sane dev defaults.
x-backend-env: &backend-env
  # Postgres — database-first. For prod cutover point these at the existing prod DB
  # and REMOVE the seed mount on `db` below.
  ConnectionStrings__Govori: "Host=db;Port=5432;Database=${POSTGRES_DB:-russpeak};Username=${POSTGRES_USER:-russpeak};Password=${POSTGRES_PASSWORD:-govori}"
  GOVORI_DB: "Host=db;Port=5432;Database=${POSTGRES_DB:-russpeak};Username=${POSTGRES_USER:-russpeak};Password=${POSTGRES_PASSWORD:-govori}"
  # Redis.
  GOVORI_REDIS: "redis:6379"
  # Object storage (MinIO). Both the GOVORI_S3_* keys and the legacy S3_* keys are set
  # (the app prefers S3_*), so either code path resolves the same bucket.
  GOVORI_S3_ENDPOINT: "http://minio:9000"
  GOVORI_S3_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
  GOVORI_S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
  GOVORI_S3_BUCKET: "${S3_BUCKET:-govori-audio}"
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_PUBLIC_URL: "${S3_PUBLIC_URL:-http://localhost:${MINIO_API_PORT:-9000}}"
  S3_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
  S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
  S3_BUCKET: "${S3_BUCKET:-govori-audio}"
  S3_REGION: "us-east-1"
  # Auth / secrets. SECRET_KEY is REQUIRED — the Api refuses to boot without it.
  SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required — copy .env.example to .env}"
  GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
  # Realtime / rate limiting.
  GOVORI_SIGNALR_BACKPLANE: "true"
  GOVORI_RATELIMIT_BACKEND: "${GOVORI_RATELIMIT_BACKEND:-redis}"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-russpeak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govori}
      POSTGRES_DB: ${POSTGRES_DB:-russpeak}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-seed a FRESH volume from the demo dump. Postgres runs *.sql / *.sql.gz in
      # /docker-entrypoint-initdb.d/ ONLY on the FIRST init of an empty data dir
      # (`docker compose ... down -v` to reset). Owner role `russpeak` == POSTGRES_USER
      # so ownership resolves cleanly.
      - ./backups/russpeak_20260711_111407.sql.gz:/docker-entrypoint-initdb.d/10-seed.sql.gz:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-russpeak} -d ${POSTGRES_DB:-russpeak}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "${DB_PORT:-5433}:5432"   # 5433 on host (5432 is often taken locally)
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped

  # One-shot: create the govori-audio bucket, then exit 0.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin}"
        mc mb --ignore-existing "local/${S3_BUCKET:-govori-audio}"
        mc anonymous set download "local/${S3_BUCKET:-govori-audio}" || true
        echo "minio bucket '${S3_BUCKET:-govori-audio}' ready"
    restart: "no"

  api:
    build:
      context: ./backend-dotnet
      dockerfile: src/Govori.Api/Dockerfile
    environment:
      <<: *backend-env
      # API is a Hangfire CLIENT (enqueues; the Worker runs the server).
      GOVORI_HANGFIRE: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # aspnet image has no shell-native probe; curl is baked into the image.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  worker:
    build:
      context: ./backend-dotnet
      dockerfile: src/Govori.Worker/Dockerfile
    environment:
      <<: *backend-env
      GOVORI_HANGFIRE: "true"      # runs the Hangfire SERVER (creates the additive `hangfire` schema)
      GOVORI_MAINTENANCE: "true"   # enables the recurring cleanup jobs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Process-liveness (no HTTP surface): the host process must be running.
      test: ["CMD-SHELL", "pgrep -f Govori.Worker.dll > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dotnet
      args:
        # Baked into the SPA at build time. Empty disables Google login.
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      # Full server block (SPA fallback + /api + /hubs proxy + WebSocket upgrade).
      - ./deploy/nginx/govori.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:

# Own network so this stack is isolated from the legacy Python compose and the
# ad-hoc govori-net test containers.
networks:
  default:
    name: govori-dotnet-net
