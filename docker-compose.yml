# ─────────────────────────────────────────────────────────────────────────────
# Govori (.NET 9) — self-contained dev/prod-parity stack.
#
#   cp .env.example .env
#   docker compose -f docker-compose.dotnet.yml up -d --build
#
# Brings up (each HEALTHY, dependency-ordered):
#   govori-db     — Postgres 16, AUTO-SEEDED from the demo dump on first run.
#                   EF Core owns the schema from the baseline migration onward;
#                   it is never auto-created at container start.
#   govori-redis  — OTP store + SignalR backplane + rate-limit backend.
#   govori-minio (+ govori-minio-init) — S3 object storage + the audio bucket.
#   govori-api    — ASP.NET Core (REST /api/*, SignalR /hubs/attempts, /health, /metrics).
#   govori-worker — Hangfire server: grading pipeline + recurring maintenance jobs.
#   govori-web    — nginx serving the Vite SPA + reverse-proxying /api and /hubs to the api.
#
# SELF-CONTAINED: its own project name, network and volumes, so it never collides with
# another stack on the same host. Container/image/volume names are explicit & professional;
# ports are parameterised in .env to avoid host clashes.
# ─────────────────────────────────────────────────────────────────────────────

name: govori

# Shared backend env (Api + Worker). Values resolve from .env with sane dev defaults.
x-backend-env: &backend-env
  # THIS FILE IS THE DEV STACK, so it must say so out loud. Both images bake
  # `…_ENVIRONMENT=Production` as their default — the right default for an image,
  # since a stack that forgets to choose should get the strict one. But it means the
  # environment is never Development unless something overrides it, and .NET reads
  # two different variable names for the two hosts: the Api (ASP.NET) reads
  # ASPNETCORE_ENVIRONMENT, the Worker (generic host) reads DOTNET_ENVIRONMENT.
  #
  # Left unset, `docker compose up` runs the dev stack in Production, where the
  # startup guard (Govori.Api/Startup) refuses to boot without a real
  # TELEGRAM_BOT_TOKEN and off the .env.example SECRET_KEY — correct in production,
  # fatal on a laptop. It also silently ignored appsettings.Development.json, which
  # is why EF was logging every SQL statement here.
  ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
  DOTNET_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
  # Postgres. To point at an existing populated DB (e.g. prod), set these to it and
  # REMOVE the seed mount on `db` below. Adopt that DB into EF's migration history
  # ONCE with deploy/ef-baseline.sh — never run `ef database update` against a
  # populated database, the baseline migration would try to recreate the schema.
  ConnectionStrings__Govori: "Host=db;Port=5432;Database=${POSTGRES_DB:-russpeak};Username=${POSTGRES_USER:-russpeak};Password=${POSTGRES_PASSWORD:-govori}"
  GOVORI_DB: "Host=db;Port=5432;Database=${POSTGRES_DB:-russpeak};Username=${POSTGRES_USER:-russpeak};Password=${POSTGRES_PASSWORD:-govori}"
  # Redis (service DNS name stays `redis` — see networks note).
  GOVORI_REDIS: "redis:6379"
  # Object storage (MinIO). Both GOVORI_S3_* and legacy S3_* keys are set so either
  # code path resolves the same bucket.
  #
  # The api/worker sign in as the APP identity minio-init creates (S3_APP_*), never
  # as the MinIO root. Every presigned URL carries its access key id in the query
  # string, and a root key behind it could create/delete buckets, add users and
  # rewrite policies. The app key can only get/put/delete/list objects in the audio
  # bucket. Dev runs the same split as prod so that a permission the code starts
  # needing fails here first, not after a deploy.
  GOVORI_S3_ENDPOINT: "http://minio:9000"
  GOVORI_S3_ACCESS_KEY: "${S3_APP_ACCESS_KEY:-govori-app}"
  GOVORI_S3_SECRET_KEY: "${S3_APP_SECRET_KEY:-govori-app-dev-only}"
  GOVORI_S3_BUCKET: "${S3_BUCKET:-govori-audio}"
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_PUBLIC_URL: "${S3_PUBLIC_URL:-http://localhost:${MINIO_API_PORT:-9000}}"
  S3_ACCESS_KEY: "${S3_APP_ACCESS_KEY:-govori-app}"
  S3_SECRET_KEY: "${S3_APP_SECRET_KEY:-govori-app-dev-only}"
  S3_BUCKET: "${S3_BUCKET:-govori-audio}"
  S3_REGION: "us-east-1"
  # Auth / secrets. SECRET_KEY is REQUIRED — the Api refuses to boot without it.
  SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required — copy .env.example to .env}"
  GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
  # Phone-OTP over a FREE Telegram bot. Set both to enable real delivery (api mints a
  # t.me/<bot>?start=<token> deep link; the worker's poller DMs the code on Start). Absent → dev
  # delivery (code logged + fixed 000000 accepted). Create the bot via @BotFather.
  TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
  TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME:-}"
  # ── AI providers (docs/08 Faza 3.4) ─────────────────────────────────────────
  # These are DEFAULTS, not the last word: every key here resolves as
  # `app_settings override → this env var → built-in default`, so an admin can paste a key or
  # reorder the chain in the panel without a redeploy, and clearing it in the panel falls back to
  # whatever is set here.
  #
  # They have to be forwarded explicitly. Until the provider chain landed, every backend was a stub
  # that reported "not configured" no matter what, so nothing in the container ever read them —
  # which meant a stack with a perfectly good `.env` full of keys could still grade nothing, and
  # look like a code bug rather than a compose omission.
  #
  # An unset key is a supported state: that backend is skipped silently and the chain moves on.
  # Claude ships this way on purpose — no ANTHROPIC_API_KEY, so it is passed over until one lands.
  GRADER_CHAIN: "${GRADER_CHAIN:-}"
  STT_CHAIN: "${STT_CHAIN:-}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
  ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-}"
  GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
  GEMINI_MODEL: "${GEMINI_MODEL:-}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  OPENAI_GRADER_MODEL: "${OPENAI_GRADER_MODEL:-}"
  WHISPER_MODEL: "${WHISPER_MODEL:-}"
  AZURE_SPEECH_KEY: "${AZURE_SPEECH_KEY:-}"
  AZURE_SPEECH_REGION: "${AZURE_SPEECH_REGION:-}"
  AZURE_OPENAI_ENDPOINT: "${AZURE_OPENAI_ENDPOINT:-}"
  AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
  AZURE_OPENAI_DEPLOYMENT: "${AZURE_OPENAI_DEPLOYMENT:-}"
  AZURE_OPENAI_API_VERSION: "${AZURE_OPENAI_API_VERSION:-}"
  # ── Faza 6 feature flags ────────────────────────────────────────────────────
  # Both default OFF, per docs/08: Faza 6 features ship behind a flag and cutover
  # does not wait for them. Same resolution as the AI keys — `app_settings` row wins,
  # this is the environment default — so a flag can be flipped from the database
  # without a redeploy, and these lines only decide what a fresh stack starts as.
  REVIEW_DRILL_ENABLED: "${REVIEW_DRILL_ENABLED:-}"
  ROLEPLAY_ENABLED: "${ROLEPLAY_ENABLED:-}"
  # Realtime / rate limiting.
  GOVORI_SIGNALR_BACKPLANE: "true"
  GOVORI_RATELIMIT_BACKEND: "${GOVORI_RATELIMIT_BACKEND:-redis}"

services:
  db:
    image: postgres:16-alpine
    container_name: govori-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-russpeak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govori}
      POSTGRES_DB: ${POSTGRES_DB:-russpeak}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-seed a FRESH volume from the demo dump. Postgres runs *.sql / *.sql.gz in
      # /docker-entrypoint-initdb.d/ ONLY on the FIRST init of an empty data dir
      # (`down -v` to reset). Owner role `russpeak` == POSTGRES_USER.
      - ./backups/russpeak_20260711_111407.sql.gz:/docker-entrypoint-initdb.d/10-seed.sql.gz:ro
      # Additive registration "Manzil" column (users.address). Runs AFTER the dump (which lacks it)
      # and BEFORE the dev/sample seeds that insert users. Idempotent.
      - ./deploy/seed/15-address-column.sql:/docker-entrypoint-initdb.d/15-address-column.sql:ro
      # Dev login accounts (student/teacher/admin @govori.uz, password Parol123!).
      # Runs after the dump. DEV ONLY — do not mount for prod.
      - ./deploy/seed/20-dev-users.sql:/docker-entrypoint-initdb.d/20-dev-users.sql:ro
      # Rich, interlinked SAMPLE DATA (4 teachers + 10 students, groups, modules, tasks,
      # graded submissions, XP, reviews, notifications). Idempotent; runs after dev users.
      # DEV ONLY — do not mount for prod.
      - ./deploy/seed/30-sample-data.sql:/docker-entrypoint-initdb.d/30-sample-data.sql:ro
      # Rich 8-week Progress/leaderboard history per student (real skills incl pronunciation,
      # rising band-trend, recent weekly XP, streaks) so the Progress screen is populated, not
      # empty. Idempotent; runs after the sample data. DEV ONLY — do not mount for prod.
      - ./deploy/seed/35-progress-sample-data.sql:/docker-entrypoint-initdb.d/35-progress-sample-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-russpeak} -d ${POSTGRES_DB:-russpeak}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "${DB_PORT:-5433}:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: govori-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    # pgsty/minio: the minio/minio repository is gone from Docker Hub (see docker-compose.prod.yml).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: govori-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped

  # One-shot bootstrap: create the audio bucket and the app's own MinIO identity,
  # then exit 0. `Exited (0)` is the expected steady state — this is not a crashed
  # service. Every step is idempotent, so a re-run converges instead of failing.
  #
  # The script is the SAME as minio-init in docker-compose.prod.yml apart from the
  # dev-only anonymous-download line at the end — change both together. It is
  # inline rather than a mounted deploy/*.sh because a Windows checkout turns a
  # mounted script into CRLF, and `sh` then fails on `set -eu\r`.
  minio-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    container_name: govori-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-govori-audio}
      S3_APP_ACCESS_KEY: ${S3_APP_ACCESS_KEY:-govori-app}
      S3_APP_SECRET_KEY: ${S3_APP_SECRET_KEY:-govori-app-dev-only}
    command:
      - |
        set -eu
        # MinIO itself refuses a user named like the root, but with an opaque error;
        # this one says what to fix. Sharing the root secret would defeat the split.
        if [ "$${S3_APP_ACCESS_KEY}" = "$${MINIO_ROOT_USER}" ] || [ "$${S3_APP_SECRET_KEY}" = "$${MINIO_ROOT_PASSWORD}" ]; then
          echo "S3_APP_ACCESS_KEY / S3_APP_SECRET_KEY must differ from MINIO_ROOT_USER / MINIO_ROOT_PASSWORD" >&2
          exit 1
        fi
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        # Exactly what MinioObjectStorage calls, on this bucket only: GetObject (also
        # authorises HEAD), PutObject (server-side and presigned PUT — both single-part,
        # so no multipart actions), DeleteObject, ListBucket (ListObjectsV2).
        # GetBucketLocation is a harmless read some S3 clients probe first. No other
        # bucket, no bucket-level writes, no admin API: those stay with the root key,
        # which only the minio server and this one-shot ever see.
        cat > /tmp/govori-app-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow",
              "Action": ["s3:ListBucket", "s3:GetBucketLocation"],
              "Resource": ["arn:aws:s3:::$${S3_BUCKET}"] },
            { "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
              "Resource": ["arn:aws:s3:::$${S3_BUCKET}/*"] }
          ]
        }
        EOF
        # `policy create` overwrites an existing policy and `user add` resets an
        # existing user's secret, so a re-run converges on the current .env. That is
        # also how the app secret is rotated: change it, re-run this, restart api+worker.
        mc admin policy create local govori-app /tmp/govori-app-policy.json
        mc admin user add local "$${S3_APP_ACCESS_KEY}" "$${S3_APP_SECRET_KEY}"
        # Attach ours unless it already is, then detach anything else attached by hand:
        # the app key must end up with exactly this policy, not "this and readwrite".
        # Parsed with parameter expansion: the mc image has no sed, grep, awk or jq.
        INFO="$$(mc admin user info local "$${S3_APP_ACCESS_KEY}" --json)"
        ATTACHED=""
        case "$$INFO" in
          *'"policyName":"'*) ATTACHED=$${INFO#*'"policyName":"'}; ATTACHED=$${ATTACHED%%'"'*} ;;
        esac
        case ",$${ATTACHED}," in
          *,govori-app,*) ;;
          *) mc admin policy attach local govori-app --user "$${S3_APP_ACCESS_KEY}" ;;
        esac
        for p in $$(printf '%s' "$${ATTACHED}" | tr ',' ' '); do
          [ "$$p" = govori-app ] || mc admin policy detach local "$$p" --user "$${S3_APP_ACCESS_KEY}"
        done
        # DEV ONLY: anonymous read on the bucket. Prod serves audio through presigned
        # URLs and deliberately leaves the bucket policy alone (docker-compose.prod.yml).
        mc anonymous set download "local/$${S3_BUCKET}" || true
        echo "minio bucket '$${S3_BUCKET}' ready; app user '$${S3_APP_ACCESS_KEY}' holds only policy govori-app"
    restart: "no"

  api:
    build:
      context: ./backend-dotnet
      dockerfile: src/Govori.Api/Dockerfile
    image: govori/api:dev
    container_name: govori-api
    environment:
      <<: *backend-env
      GOVORI_HANGFIRE: "true"   # API is a Hangfire CLIENT (enqueues; the Worker runs the server)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    ports:
      - "${API_PORT:-8082}:8080"
    restart: unless-stopped

  worker:
    build:
      context: ./backend-dotnet
      dockerfile: src/Govori.Worker/Dockerfile
    image: govori/worker:dev
    container_name: govori-worker
    environment:
      <<: *backend-env
      GOVORI_HANGFIRE: "true"      # runs the Hangfire SERVER (creates the additive `hangfire` schema)
      GOVORI_MAINTENANCE: "true"   # enables the recurring cleanup jobs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # The worker signs in as the app user, which exists only once minio-init ran.
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f Govori.Worker.dll > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        # THIS FILE IS THE DEV STACK — the same argument the backend env block above
        # makes, applied to the SPA. Left on the image default this stack served a
        # PRODUCTION bundle: `import.meta.env.DEV` was false, so every development-only
        # tool (today: the login page's one-tap demo-account picker) was compiled out of
        # the one place it is meant to be used. docker-compose.prod.yml passes nothing
        # here and gets the strict default. See frontend/Dockerfile.
        BUILD_NODE_ENV: "${FRONTEND_BUILD_NODE_ENV:-development}"
    image: govori/web:dev
    container_name: govori-web
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./deploy/nginx/govori.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  pgdata:
    name: govori-pgdata
  redisdata:
    name: govori-redisdata
  miniodata:
    name: govori-miniodata

# Own network so this stack is isolated from other projects on this machine.
networks:
  default:
    name: govori-net
