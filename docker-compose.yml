# ─────────────────────────────────────────────────────────────────────────────
# Govori (.NET 9) — self-contained dev/prod-parity stack.
#
#   cp .env.example .env
#   docker compose -f docker-compose.dotnet.yml up -d --build
#
# Brings up (each HEALTHY, dependency-ordered):
#   govori-db     — Postgres 16, AUTO-SEEDED from the demo dump on first run.
#                   EF Core owns the schema from the baseline migration onward;
#                   it is never auto-created at container start.
#   govori-redis  — OTP store + SignalR backplane + rate-limit backend.
#   govori-minio (+ govori-minio-init) — S3 object storage + the audio bucket.
#   govori-api    — ASP.NET Core (REST /api/*, SignalR /hubs/attempts, /health, /metrics).
#   govori-worker — Hangfire server: grading pipeline + recurring maintenance jobs.
#   govori-web    — nginx serving the Vite SPA + reverse-proxying /api and /hubs to the api.
#
# SELF-CONTAINED: its own project name, network and volumes, so it never collides with
# another stack on the same host. Container/image/volume names are explicit & professional;
# ports are parameterised in .env to avoid host clashes.
# ─────────────────────────────────────────────────────────────────────────────

name: govori

# Shared backend env (Api + Worker). Values resolve from .env with sane dev defaults.
x-backend-env: &backend-env
  # Postgres. To point at an existing populated DB (e.g. prod), set these to it and
  # REMOVE the seed mount on `db` below. Adopt that DB into EF's migration history
  # ONCE with deploy/ef-baseline.sh — never run `ef database update` against a
  # populated database, the baseline migration would try to recreate the schema.
  ConnectionStrings__Govori: "Host=db;Port=5432;Database=${POSTGRES_DB:-russpeak};Username=${POSTGRES_USER:-russpeak};Password=${POSTGRES_PASSWORD:-govori}"
  GOVORI_DB: "Host=db;Port=5432;Database=${POSTGRES_DB:-russpeak};Username=${POSTGRES_USER:-russpeak};Password=${POSTGRES_PASSWORD:-govori}"
  # Redis (service DNS name stays `redis` — see networks note).
  GOVORI_REDIS: "redis:6379"
  # Object storage (MinIO). Both GOVORI_S3_* and legacy S3_* keys are set so either
  # code path resolves the same bucket.
  GOVORI_S3_ENDPOINT: "http://minio:9000"
  GOVORI_S3_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
  GOVORI_S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
  GOVORI_S3_BUCKET: "${S3_BUCKET:-govori-audio}"
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_PUBLIC_URL: "${S3_PUBLIC_URL:-http://localhost:${MINIO_API_PORT:-9000}}"
  S3_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
  S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
  S3_BUCKET: "${S3_BUCKET:-govori-audio}"
  S3_REGION: "us-east-1"
  # Auth / secrets. SECRET_KEY is REQUIRED — the Api refuses to boot without it.
  SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required — copy .env.example to .env}"
  GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
  # Phone-OTP over a FREE Telegram bot. Set both to enable real delivery (api mints a
  # t.me/<bot>?start=<token> deep link; the worker's poller DMs the code on Start). Absent → dev
  # delivery (code logged + fixed 000000 accepted). Create the bot via @BotFather.
  TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
  TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME:-}"
  # ── AI providers (docs/08 Faza 3.4) ─────────────────────────────────────────
  # These are DEFAULTS, not the last word: every key here resolves as
  # `app_settings override → this env var → built-in default`, so an admin can paste a key or
  # reorder the chain in the panel without a redeploy, and clearing it in the panel falls back to
  # whatever is set here.
  #
  # They have to be forwarded explicitly. Until the provider chain landed, every backend was a stub
  # that reported "not configured" no matter what, so nothing in the container ever read them —
  # which meant a stack with a perfectly good `.env` full of keys could still grade nothing, and
  # look like a code bug rather than a compose omission.
  #
  # An unset key is a supported state: that backend is skipped silently and the chain moves on.
  # Claude ships this way on purpose — no ANTHROPIC_API_KEY, so it is passed over until one lands.
  GRADER_CHAIN: "${GRADER_CHAIN:-}"
  STT_CHAIN: "${STT_CHAIN:-}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
  ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-}"
  GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
  GEMINI_MODEL: "${GEMINI_MODEL:-}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  OPENAI_GRADER_MODEL: "${OPENAI_GRADER_MODEL:-}"
  WHISPER_MODEL: "${WHISPER_MODEL:-}"
  AZURE_SPEECH_KEY: "${AZURE_SPEECH_KEY:-}"
  AZURE_SPEECH_REGION: "${AZURE_SPEECH_REGION:-}"
  AZURE_OPENAI_ENDPOINT: "${AZURE_OPENAI_ENDPOINT:-}"
  AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
  AZURE_OPENAI_DEPLOYMENT: "${AZURE_OPENAI_DEPLOYMENT:-}"
  AZURE_OPENAI_API_VERSION: "${AZURE_OPENAI_API_VERSION:-}"
  # Realtime / rate limiting.
  GOVORI_SIGNALR_BACKPLANE: "true"
  GOVORI_RATELIMIT_BACKEND: "${GOVORI_RATELIMIT_BACKEND:-redis}"

services:
  db:
    image: postgres:16-alpine
    container_name: govori-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-russpeak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govori}
      POSTGRES_DB: ${POSTGRES_DB:-russpeak}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-seed a FRESH volume from the demo dump. Postgres runs *.sql / *.sql.gz in
      # /docker-entrypoint-initdb.d/ ONLY on the FIRST init of an empty data dir
      # (`down -v` to reset). Owner role `russpeak` == POSTGRES_USER.
      - ./backups/russpeak_20260711_111407.sql.gz:/docker-entrypoint-initdb.d/10-seed.sql.gz:ro
      # Additive registration "Manzil" column (users.address). Runs AFTER the dump (which lacks it)
      # and BEFORE the dev/sample seeds that insert users. Idempotent.
      - ./deploy/seed/15-address-column.sql:/docker-entrypoint-initdb.d/15-address-column.sql:ro
      # Dev login accounts (student/teacher/admin @govori.uz, password Parol123!).
      # Runs after the dump. DEV ONLY — do not mount for prod.
      - ./deploy/seed/20-dev-users.sql:/docker-entrypoint-initdb.d/20-dev-users.sql:ro
      # Rich, interlinked SAMPLE DATA (4 teachers + 10 students, groups, modules, tasks,
      # graded submissions, XP, reviews, notifications). Idempotent; runs after dev users.
      # DEV ONLY — do not mount for prod.
      - ./deploy/seed/30-sample-data.sql:/docker-entrypoint-initdb.d/30-sample-data.sql:ro
      # Rich 8-week Progress/leaderboard history per student (real skills incl pronunciation,
      # rising band-trend, recent weekly XP, streaks) so the Progress screen is populated, not
      # empty. Idempotent; runs after the sample data. DEV ONLY — do not mount for prod.
      - ./deploy/seed/35-progress-sample-data.sql:/docker-entrypoint-initdb.d/35-progress-sample-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-russpeak} -d ${POSTGRES_DB:-russpeak}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "${DB_PORT:-5433}:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: govori-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: govori-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped

  # One-shot bootstrap: create the audio bucket, then exit 0. `Exited (0)` is the
  # expected steady state — this is not a crashed service.
  minio-init:
    image: minio/mc
    container_name: govori-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin}"
        mc mb --ignore-existing "local/${S3_BUCKET:-govori-audio}"
        mc anonymous set download "local/${S3_BUCKET:-govori-audio}" || true
        echo "minio bucket '${S3_BUCKET:-govori-audio}' ready"
    restart: "no"

  api:
    build:
      context: ./backend-dotnet
      dockerfile: src/Govori.Api/Dockerfile
    image: govori/api:dev
    container_name: govori-api
    environment:
      <<: *backend-env
      GOVORI_HANGFIRE: "true"   # API is a Hangfire CLIENT (enqueues; the Worker runs the server)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    ports:
      - "${API_PORT:-8082}:8080"
    restart: unless-stopped

  worker:
    build:
      context: ./backend-dotnet
      dockerfile: src/Govori.Worker/Dockerfile
    image: govori/worker:dev
    container_name: govori-worker
    environment:
      <<: *backend-env
      GOVORI_HANGFIRE: "true"      # runs the Hangfire SERVER (creates the additive `hangfire` schema)
      GOVORI_MAINTENANCE: "true"   # enables the recurring cleanup jobs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f Govori.Worker.dll > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    image: govori/web:dev
    container_name: govori-web
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./deploy/nginx/govori.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  pgdata:
    name: govori-pgdata
  redisdata:
    name: govori-redisdata
  miniodata:
    name: govori-miniodata

# Own network so this stack is isolated from other projects on this machine.
networks:
  default:
    name: govori-net
