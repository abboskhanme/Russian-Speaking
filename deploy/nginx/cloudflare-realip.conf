# Govori — the client address when govorim.uz is proxied by Cloudflare.
#
# Behind Cloudflare every connection to this nginx comes from a Cloudflare edge,
# so $remote_addr is Cloudflare's address, not the student's. The API keys every
# per-IP rate limit (OTP sends, the public placement) on the address nginx hands
# it, and with all traffic arriving from a few edges those limits would throttle
# everyone together. This is the realip switch the "Client address" note in
# govori-prod.conf.template asks for when a CDN is put in front.
#
# Only connections FROM the ranges below may set the address, through
# CF-Connecting-IP (one value, written by Cloudflare — not the appendable
# X-Forwarded-For). A client connecting directly is not in these ranges, so a
# forged CF-Connecting-IP is ignored and $remote_addr stays the real peer. Safe
# to keep mounted with Cloudflare switched off.
#
# Ranges: https://www.cloudflare.com/ips-v4 and /ips-v6, fetched 2026-10-26. They
# change rarely; deploy/cloudflare-firewall.sh reads the live lists and says when
# this file has drifted from them.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
