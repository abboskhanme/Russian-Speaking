# Govori SPA + reverse proxy — mounted by docker-compose.dotnet.yml at
# /etc/nginx/conf.d/default.conf in the frontend (nginx) container.
#
#   • Serves the built Vite SPA with client-side routing fallback.
#   • Proxies /api/ and /hubs/ to the `api` service (container port 8080).
#   • /hubs/ carries the SignalR WebSocket upgrade so realtime attempt progress works.
#
# TLS is terminated upstream in prod (see deploy/setup-domain.sh); this block is plain
# HTTP behind that terminator / for local dev.

# Map the client Upgrade header so idle keep-alive connections don't send a stale
# "Connection: upgrade" (required for correct WebSocket proxying).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream govori_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    # gzip for text assets. Vite emits content-hashed filenames under /assets/.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/wasm font/woff2;

    client_max_body_size 30m;   # audio answers are small; keep headroom.

    root /usr/share/nginx/html;
    index index.html;

    # REST API → Govori.Api. The SPA calls /api/v1/... (frontend/src/lib/api.ts).
    location /api/ {
        proxy_pass http://govori_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SignalR hub → Govori.Api, WITH the WebSocket upgrade (docs/08 Faza 3.10).
    location /hubs/ {
        proxy_pass http://govori_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # long-lived hub connection
        proxy_send_timeout 3600s;
    }

    # Long cache for content-hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
