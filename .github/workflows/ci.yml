name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        working-directory: backend-dotnet
        run: dotnet restore Govori.sln

      - name: Build
        working-directory: backend-dotnet
        run: dotnet build Govori.sln --no-restore -c Release

      # ── The contract document has to be CURRENT, not merely present ────────
      # backend-dotnet/openapi.json is a committed file, which means it can go stale — and a stale
      # document is worse than no document. The frontend gate would compare types.ts against last
      # month's contract, the two would agree perfectly because both are old, and CI would report
      # "the contract holds" about a contract nobody checked. That is the same silent drift this
      # whole gate exists to prevent, only now wearing a green tick.
      #
      # So: regenerate and fail on any diff. The emit BUILDS the host and never STARTS it, so this
      # step needs no Postgres, no Redis and no S3 — verified by running it in a container with no
      # network at all. SECRET_KEY is a throwaway with a self-describing value: the host refuses to
      # boot without one, and nothing here signs a token. --no-launch-profile keeps the output
      # independent of launchSettings.json, which is also why ASPNETCORE_ENVIRONMENT is set by
      # hand — the profile was quietly supplying it, and without it the production-secrets guard
      # (correctly) refuses to build a host with no Telegram token and no database. The document is
      # byte-identical under either environment; this is about getting the host built at all.
      - name: The OpenAPI document must be current
        working-directory: backend-dotnet
        env:
          ASPNETCORE_ENVIRONMENT: Development
          SECRET_KEY: openapi-emit-only-not-a-real-secret
        run: |
          dotnet run --project src/Govori.Api -c Release --no-build --no-launch-profile \
            -- --emit-openapi "$GITHUB_WORKSPACE/backend-dotnet/openapi.json"
          git diff --exit-code -- openapi.json || {
            echo ""
            echo "openapi.json is stale — the API changed and the document did not follow."
            echo "Regenerate it and commit the result (docs/09-DOCKER.md):"
            echo "  dotnet run --project src/Govori.Api -c Release -- --emit-openapi ../backend-dotnet/openapi.json"
            exit 1
          }

      # Unit / Arch / Characterization run with no external dependencies.
      # Govori.IntegrationTests is DELIBERATELY excluded: it needs a live
      # Postgres + Redis + MinIO and mutates rows in setup, so it belongs in a
      # compose-backed job rather than here. Run it locally via docker compose.
      - name: Test (Unit)
        working-directory: backend-dotnet
        run: dotnet test tests/Govori.UnitTests --no-build -c Release --verbosity normal

      - name: Test (Architecture)
        working-directory: backend-dotnet
        run: dotnet test tests/Govori.ArchTests --no-build -c Release --verbosity normal

      # Reads the frozen JSON goldens from tests/characterization/fixtures at the
      # REPO ROOT, which is why this runs from the checkout rather than a subdir.
      - name: Test (Characterization)
        working-directory: backend-dotnet
        run: dotnet test tests/Govori.Characterization --no-build -c Release --verbosity normal

  # The AI regression gate (docs/08 Faza 1.6). Its own job because it calls real
  # vendors: it costs money, it takes ~a minute, and a vendor outage must read as
  # "the gate could not run" rather than as "the backend is broken".
  #
  # Gated on the secret rather than skipped by hand. A fork PR has no secrets, so
  # this would otherwise fail on every outside contribution — and the fix people
  # reach for in that situation is `continue-on-error`, which turns the gate into
  # decoration. Absent key ⇒ the job does not run at all and its absence is
  # visible; present key ⇒ it runs and it blocks.
  golden:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Guard — a key must be present
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Fail loudly rather than passing on an unconfigured runner. A golden-set
          # job that silently measured nothing is worse than no job: it reports a
          # green tick for a grader nobody checked.
          if [ -z "$GEMINI_API_KEY$OPENAI_API_KEY$ANTHROPIC_API_KEY" ]; then
            echo "No grader key configured — the golden set cannot measure anything."
            echo "Set at least one of GEMINI_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY."
            exit 1
          fi

      - name: Build
        working-directory: backend-dotnet
        run: dotnet build tests/Govori.UnitTests -c Release

      # Reads tests/golden/grader/cases.json from the REPO ROOT, hence no
      # working-directory here. Fails the PR below 90% of assertions.
      - name: Grader golden set
        working-directory: backend-dotnet
        env:
          GOVORI_GOLDEN: "1"
          GRADER_CHAIN: ${{ secrets.GRADER_CHAIN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_GRADER_MODEL: ${{ secrets.OPENAI_GRADER_MODEL }}
        run: |
          dotnet vstest tests/Govori.UnitTests/bin/Release/net9.0/Govori.UnitTests.dll \
            --TestCaseFilter:"FullyQualifiedName~GraderGoldenSet" \
            --logger:"console;verbosity=detailed"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: frontend
        # The browsers live in the Playwright image / the e2e job, not here.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      # ── The hand-written API types vs the backend's OpenAPI document ───────
      # docs/08 Faza 4.2. `tsc` above proves the frontend agrees with ITSELF; it cannot see a
      # backend change, because src/shared/api/types.ts is written by hand (deliberately — it
      # carries ~1400 lines of reasoning a generator would delete). This step is what notices a
      # field the API added, removed, renamed or retyped.
      #
      # It is only half the check. The other half lives in the `backend` job, which regenerates
      # openapi.json and fails on a diff — without it, this step would only prove that two stale
      # files agree with each other. The script itself refuses to run against a stub document
      # (fewer than 50 paths or 50 schemas) rather than passing on nothing.
      - name: API contract gate
        working-directory: frontend
        run: npm run check:contract

      # Vitest (jsdom). `tsc` above proves the frontend COMPILES; this is the only
      # step that says anything about whether it works.
      - name: Test (Unit)
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      # Reads dist/.vite/manifest.json and fails when the INITIAL entry graph
      # exceeds the docs/08 §4.1 budget. Must run after Build — it measures the
      # artefact, not the source.
      - name: Bundle budget
        working-directory: frontend
        run: npm run check:budget

  # Playwright needs the whole stack (nginx + API + Postgres + Redis + MinIO), so
  # it gets its own job rather than a step in `frontend` that would have to be
  # skipped — a skipped step is a green tick that proves nothing.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stack up
        run: |
          cp .env.example .env
          # The API refuses to boot without SECRET_KEY, and the e2e suite mints its
          # own access token with the SAME key (auth is phone+OTP over Telegram —
          # there is no credential a test can type). One value, one file, both read it.
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env
          docker compose up -d --build

      - name: Wait for the stack
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8082/health >/dev/null \
               && curl -fsS http://localhost:8081/ >/dev/null; then
              echo "stack is up"; exit 0
            fi
            sleep 5
          done
          echo "stack did not become healthy"; docker compose ps; exit 1

      - name: Resolve the seeded users
        # `deploy/seed/20-dev-users.sql` inserts with gen_random_uuid(), so the ids
        # are per-database and cannot be hard-coded in the suite. Two are needed:
        # the student drives its own journey, and the admin drives the admin one
        # AND is how e2e/people.ts finds a teacher with a non-empty grading queue.
        run: |
          resolve() {
            docker compose exec -T db psql -U russpeak -d russpeak -tAc \
              "select id from users where email = '$1'" | tr -d '[:space:]'
          }
          STUDENT=$(resolve 'student@govori.uz')
          ADMIN=$(resolve 'admin@govori.uz')
          test -n "$STUDENT" || { echo "dev student not seeded"; exit 1; }
          test -n "$ADMIN" || { echo "dev admin not seeded"; exit 1; }
          echo "E2E_STUDENT_ID=$STUDENT" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_ID=$ADMIN" >> "$GITHUB_ENV"

      - name: Install
        working-directory: frontend
        # Skip the postinstall's download of all three engines; only Chromium is
        # driven here, and it is fetched explicitly on the next step.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test (E2E + axe)
        working-directory: frontend
        env:
          # The runner IS the host here, so the published port is correct. Inside a
          # container it would have to be http://govori-web on govori-net.
          E2E_BASE_URL: http://localhost:8081
          GOVORI_ENV_FILE: ${{ github.workspace }}/.env
        run: npm run test:e2e

      - name: Failure diagnostics
        if: failure()
        run: docker compose logs --tail=200 api frontend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: frontend/e2e/.artifacts
          retention-days: 7

  # ── The integration suite, which CI has never run ───────────────────────────
  # `backend` above skips it with the note "it needs a live Postgres + Redis +
  # MinIO and mutates rows in setup". The first half is true and is what this job
  # provides; the second half is not, and that is why the exclusion was costing
  # more than it saved. TestDatabase creates a per-run `govori_it_*` database and
  # drops it afterwards, so the suite never touches the compose database — the
  # only thing it needed was a server to create that database ON.
  #
  # ~56 tests covering the paths unit tests structurally cannot: real SQL against
  # real Postgres enum mappings, presigned URLs against a real S3 implementation,
  # and the OTP round trip through a real Redis.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # Only the backing services. Building api/worker/web here would double the
      # job's runtime to test nothing this suite exercises.
      - name: Backing services up
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env
          docker compose up -d db redis minio minio-init
          for _ in $(seq 1 60); do
            if docker compose exec -T db pg_isready -U russpeak -q 2>/dev/null; then
              echo "postgres is up"; exit 0
            fi
            sleep 2
          done
          echo "postgres did not become ready"; docker compose ps; exit 1

      - name: Build
        working-directory: backend-dotnet
        run: dotnet build tests/Govori.IntegrationTests -c Release

      - name: Test (Integration)
        working-directory: backend-dotnet
        # GOVORI_TEST_DB names the SERVER only — TestDatabase replaces the database
        # name with its own per-run one. Passed explicitly rather than letting the
        # fixture read the repo .env: the two agree today, and a silent
        # disagreement tomorrow would have this job quietly testing nothing.
        #
        # The AI keys and TELEGRAM_BOT_TOKEN are deliberately NOT provided. Five of
        # these tests assert the "not configured" behaviour, so handing the suite a
        # populated .env makes them fail for a reason that has nothing to do with
        # the code.
        env:
          GOVORI_TEST_DB: "Host=localhost;Port=5433;Database=russpeak;Username=russpeak;Password=russpeak"
          GOVORI_S3_ENDPOINT: "http://localhost:9000"
          GOVORI_S3_ACCESS_KEY: minioadmin
          GOVORI_S3_SECRET_KEY: minioadmin
          GOVORI_S3_BUCKET: govori-audio
        run: dotnet test tests/Govori.IntegrationTests --no-build -c Release --verbosity normal

      - name: Failure diagnostics
        if: failure()
        run: docker compose logs --tail=100 db redis minio

  # ── Do the images actually build? ───────────────────────────────────────────
  # Nothing in CI built a container image, so the first time anyone found out was
  # on the droplet, during the cutover window. This job caught a real one on its
  # first run: api and worker share a BuildKit NuGet cache mount, `docker compose
  # build` runs them concurrently, and with the default sharing=shared the two
  # `dotnet restore` processes corrupt each other's extraction staging. It passes
  # on a warm cache and fails on a machine that has never built before — which is
  # exactly the droplet.
  #
  # It builds the PROD compose file, so it also type-checks that file: a bad
  # interpolation or a missing build context fails here rather than at 02:00.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all three images
        env:
          # Placeholders only. This job proves the images BUILD; nothing is run
          # against real data and nothing is pushed anywhere.
          IMAGE_TAG: ci-${{ github.sha }}
          GOVORI_SERVER_NAME: example.invalid
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          MINIO_ROOT_USER: ciaccesskey
          MINIO_ROOT_PASSWORD: cisecretkey
          S3_BUCKET: govori-audio
          S3_PUBLIC_URL: https://example.invalid
          SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
        run: docker compose -f docker-compose.prod.yml build

      - name: The runtime images must not run as root
        env:
          IMAGE_TAG: ci-${{ github.sha }}
        run: |
          # A non-root USER is easy to add and just as easy to lose in a refactor,
          # and nothing at runtime complains when it goes missing.
          for img in "govori/api:ci-${{ github.sha }}" "govori/worker:ci-${{ github.sha }}"; do
            u=$(docker image inspect "$img" --format '{{.Config.User}}')
            echo "$img runs as '${u:-root}'"
            [ -n "$u" ] && [ "$u" != "root" ] && [ "$u" != "0" ] || { echo "FAIL: $img would run as root"; exit 1; }
          done

      - name: The frontend image must serve the SPA
        env:
          IMAGE_TAG: ci-${{ github.sha }}
        run: |
          # `docker run` of the image on its own — the baked-in server block and
          # the HEALTHCHECK both have to work without compose mounting anything.
          docker run -d --name ci-web -p 8099:80 "govori/web:ci-${{ github.sha }}"
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8099/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8099/healthz
          curl -fsS http://localhost:8099/ | grep -qi '<div id="root"' \
            || { echo "FAIL: the image does not serve the SPA"; docker logs ci-web; exit 1; }
          # SPA fallback: a client-side route must return the app, not a 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8099/teacher/klasslar)" = "200"
          docker rm -f ci-web

  # ── The deploy scripts themselves ───────────────────────────────────────────
  # These run as root on a droplet holding the only copy of 50 users' data, and
  # until now nothing checked them at all.
  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            -S warning $(git ls-files 'deploy/*.sh')

      - name: Both compose files must render
        env:
          IMAGE_TAG: ci
          GOVORI_SERVER_NAME: example.invalid
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          MINIO_ROOT_USER: ciaccesskey
          MINIO_ROOT_PASSWORD: cisecretkey
          S3_BUCKET: govori-audio
          S3_PUBLIC_URL: https://example.invalid
          SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.prod.yml config >/dev/null

      - name: The prod compose must publish ONLY nginx's ports
        env:
          IMAGE_TAG: ci
          GOVORI_SERVER_NAME: example.invalid
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          MINIO_ROOT_USER: ciaccesskey
          MINIO_ROOT_PASSWORD: cisecretkey
          S3_BUCKET: govori-audio
          S3_PUBLIC_URL: https://example.invalid
          SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
        run: |
          # A droplet has no firewall by default, so a `ports:` line added to db
          # during a debugging session and left there is an internet-facing
          # Postgres. Assert the shape rather than trusting review to catch it.
          PUB=$(docker compose -f docker-compose.prod.yml config \
                | awk '/^  [a-z-]+:$/{sub(/:$/,"",$1); s=$1} /published:/{gsub(/"/,"",$2); print s "/" $2}')
          echo "published: $PUB"
          UNEXPECTED=$(echo "$PUB" | grep -vE '^(web/80|web/443)$' | grep -v '^$' || true)
          [ -z "$UNEXPECTED" ] || { echo "FAIL: unexpected published ports: $UNEXPECTED"; exit 1; }

      - name: Every service must rotate its logs
        env:
          IMAGE_TAG: ci
          GOVORI_SERVER_NAME: example.invalid
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          MINIO_ROOT_USER: ciaccesskey
          MINIO_ROOT_PASSWORD: cisecretkey
          S3_BUCKET: govori-audio
          S3_PUBLIC_URL: https://example.invalid
          SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
        run: |
          # json-file logs are unbounded by default and one GET /api/profile/stats
          # writes ~5.4 KB. A full disk stops Postgres writing its WAL, and the
          # outage then presents as a database fault. One service missing this is
          # enough to fill the disk.
          docker compose -f docker-compose.prod.yml config > /tmp/prod.rendered.yml
          MISSING=""
          while IFS= read -r s; do
            [ -n "$s" ] || continue
            awk -v want="  $s:" '$0==want{i=1;next} /^  [a-z0-9-]+:$/{i=0} i' /tmp/prod.rendered.yml \
              | grep -q 'max-size' || MISSING="$MISSING $s"
          done < <(docker compose -f docker-compose.prod.yml config --services)
          [ -z "$MISSING" ] || { echo "FAIL: no log rotation on:$MISSING"; exit 1; }
          echo "all services rotate logs"

      # The backup script's own test suite. It proves the nightly backup cannot
      # delete a good backup when the dump fails — the exact failure that wiped a
      # week of backups before. A fix is worth what its test is worth, so the test
      # runs here rather than being something someone remembers to run.
      - name: Backup safety suite
        run: bash deploy/test-backup-cron.sh
